<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>部活動活動記録アプリ - clubapp</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-white/10 p-2 rounded-lg">
          <i data-lucide="clipboard-list" class="w-6 h-6"></i>
        </div>
        <h1 class="text-xl font-bold tracking-tight">部活動活動記録アプリ</h1>
      </div>
      
      <!-- User Info & Logout (Visible when logged in) -->
      <div id="user-profile" class="hidden flex items-center space-x-3">
        <img id="user-photo" class="w-8 h-8 rounded-full border-2 border-white/50" src="" alt="User Photo" onerror="this.src='https://placehold.co/100x100/indigo/white?text=User'">
        <div class="hidden sm:block text-right">
          <p id="user-name" class="text-sm font-medium leading-tight"></p>
          <p id="user-email" class="text-xs text-indigo-200 leading-tight"></p>
        </div>
        <button id="logout-btn" class="bg-indigo-700 hover:bg-indigo-800 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-1">
          <i data-lucide="log-out" class="w-4 h-4"></i>
          <span class="hidden sm:inline">ログアウト</span>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- LOGIN SCREEN -->
    <section id="login-section" class="flex flex-col items-center justify-center min-h-[60vh]">
      <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center border border-slate-100">
        <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-6">
          <i data-lucide="activity" class="w-8 h-8"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-900 mb-2">部活動記録へようこそ</h2>
        <p class="text-slate-500 text-sm mb-8">日々の活動内容・反省・参加人数を記録して振り返りましょう。閲覧・記録にはGoogleログインが必要です。</p>
        
        <button id="login-btn" class="w-full bg-white hover:bg-slate-50 text-slate-700 font-semibold py-3 px-4 border border-slate-300 rounded-xl shadow-sm transition duration-150 flex items-center justify-center space-x-3">
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Googleアカウントでログイン</span>
        </button>
      </div>
    </section>

    <!-- MAIN APP DASHBOARD (Hidden until logged in) -->
    <section id="app-section" class="hidden space-y-8">

      <!-- Alert Notification Area -->
      <div id="alert-box" class="hidden p-4 rounded-xl border flex items-center justify-between transition-all">
        <span id="alert-msg" class="text-sm font-medium"></span>
        <button id="alert-close" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- FORM COLUMN -->
        <div class="lg:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 h-fit">
          <div class="flex items-center justify-between mb-5">
            <h2 id="form-title" class="text-lg font-bold text-slate-900 flex items-center gap-2">
              <i data-lucide="plus-circle" class="w-5 h-5 text-indigo-600"></i>
              新しい活動を記録
            </h2>
            <button id="cancel-edit-btn" class="hidden text-xs text-rose-600 hover:text-rose-800 font-medium underline">
              編集をキャンセル
            </button>
          </div>

          <form id="record-form" class="space-y-4">
            <input type="hidden" id="edit-doc-id" value="">

            <!-- 1. 部活動名 -->
            <div>
              <label for="club-name" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">
                部活動名 <span class="text-rose-500">*</span>
              </label>
              <select id="club-name" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:outline-none transition text-sm">
                <option value="">選択してください</option>
                <option value="野球部">野球部</option>
                <option value="サッカー部">サッカー部</option>
                <option value="陸上競技部">陸上競技部</option>
                <option value="バスケットボール部">バスケットボール部</option>
                <option value="バレーボール部">バレーボール部</option>
                <option value="吹奏楽部">吹奏楽部</option>
                <option value="パソコン部">パソコン部</option>
                <option value="農業クラブ">農業クラブ</option>
                <option value="その他">その他</option>
              </select>
            </div>

            <!-- 2. 活動日 -->
            <div>
              <label for="activity-date" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">
                活動日 <span class="text-rose-500">*</span>
              </label>
              <input type="date" id="activity-date" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:outline-none transition text-sm">
            </div>

            <!-- 3. 参加人数 -->
            <div>
              <label for="member-count" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">
                参加人数 (人) <span class="text-rose-500">*</span>
              </label>
              <input type="number" id="member-count" min="1" placeholder="例: 15" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:outline-none transition text-sm">
            </div>

            <!-- 4. 活動内容 -->
            <div>
              <label for="activity-content" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">
                活動内容 <span class="text-rose-500">*</span>
              </label>
              <textarea id="activity-content" rows="3" placeholder="本日の練習メニューや活動の概要を入力してください" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:outline-none transition text-sm resize-none"></textarea>
            </div>

            <!-- 5. 反省・気づき -->
            <div>
              <label for="activity-reflection" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">
                反省・気づき <span class="text-rose-500">*</span>
              </label>
              <textarea id="activity-reflection" rows="3" placeholder="良かった点、次回への課題や注意点など" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:outline-none transition text-sm resize-none"></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-xl shadow-md shadow-indigo-200 transition duration-150 flex items-center justify-center gap-2">
              <i data-lucide="save" class="w-4 h-4"></i>
              <span id="submit-btn-text">記録を登録する</span>
            </button>
          </form>
        </div>

        <!-- DASHBOARD & LIST COLUMN -->
        <div class="lg:col-span-2 space-y-6">

          <!-- Analytics Chart Card -->
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80">
            <h3 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
              <i data-lucide="line-chart" class="w-5 h-5 text-indigo-600"></i>
              参加人数の推移
            </h3>
            <div class="h-48 w-full relative">
              <canvas id="attendanceChart"></canvas>
            </div>
          </div>

          <!-- Record List & Filters -->
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80">
            
            <!-- Controls Bar -->
            <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between mb-6 pb-4 border-b border-slate-100">
              <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
                <i data-lucide="list" class="w-5 h-5 text-indigo-600"></i>
                活動記録一覧
              </h3>

              <div class="flex flex-wrap items-center gap-2">
                <!-- Filter by Club -->
                <select id="filter-club" class="px-3 py-1.5 bg-slate-100 border border-slate-200 rounded-lg text-xs font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500">
                  <option value="ALL">すべての部活</option>
                  <option value="野球部">野球部</option>
                  <option value="サッカー部">サッカー部</option>
                  <option value="陸上競技部">陸上競技部</option>
                  <option value="バスケットボール部">バスケットボール部</option>
                  <option value="バレーボール部">バレーボール部</option>
                  <option value="吹奏楽部">吹奏楽部</option>
                  <option value="パソコン部">パソコン部</option>
                  <option value="農業クラブ">農業クラブ</option>
                  <option value="その他">その他</option>
                </select>

                <!-- Sort Order -->
                <select id="sort-order" class="px-3 py-1.5 bg-slate-100 border border-slate-200 rounded-lg text-xs font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500">
                  <option value="desc">新しい日付順</option>
                  <option value="asc">古い日付順</option>
                </select>
              </div>
            </div>

            <!-- List Container -->
            <div id="records-list" class="space-y-4">
              <div class="text-center py-12 text-slate-400">
                <i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto mb-2"></i>
                <p class="text-sm">データを読み込み中...</p>
              </div>
            </div>

          </div>

        </div>

      </div>

    </section>

  </main>

  <footer class="bg-white border-t border-slate-200 py-6 mt-12 text-center text-xs text-slate-500">
    <p>© 2026 部活動活動記録アプリ (clubapp)</p>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithPopup, 
      signOut, 
      onAuthStateChanged,
      setPersistence,
      browserLocalPersistence,
      indexedDBLocalPersistence,
      inMemoryPersistence
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      doc, 
      updateDoc, 
      deleteDoc, 
      onSnapshot, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // -------------------------------------------------------------
    // Firebase Configuration
    // プロジェクト「bukatudounokiroku」の設定
    // -------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyD2j06PTu9ByzE4UyGiVxdiVDOinYyfsBc",
      authDomain: "bukatudounokiroku.firebaseapp.com",
      projectId: "bukatudounokiroku",
      storageBucket: "bukatudounokiroku.firebasestorage.app",
      messagingSenderId: "847775283335",
      appId: "1:847775283335:web:909fb25f12ebe917556022"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // DOM Elements
    const loginSection = document.getElementById('login-section');
    const appSection = document.getElementById('app-section');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const userProfile = document.getElementById('user-profile');
    const userName = document.getElementById('user-name');
    const userEmail = document.getElementById('user-email');
    const userPhoto = document.getElementById('user-photo');

    const recordForm = document.getElementById('record-form');
    const clubNameInput = document.getElementById('club-name');
    const activityDateInput = document.getElementById('activity-date');
    const memberCountInput = document.getElementById('member-count');
    const activityContentInput = document.getElementById('activity-content');
    const activityReflectionInput = document.getElementById('activity-reflection');
    const editDocIdInput = document.getElementById('edit-doc-id');
    const submitBtnText = document.getElementById('submit-btn-text');
    const formTitle = document.getElementById('form-title');
    const cancelEditBtn = document.getElementById('cancel-edit-btn');

    const filterClub = document.getElementById('filter-club');
    const sortOrder = document.getElementById('sort-order');
    const recordsList = document.getElementById('records-list');

    const alertBox = document.getElementById('alert-box');
    const alertMsg = document.getElementById('alert-msg');
    const alertClose = document.getElementById('alert-close');

    // State Variables
    let currentUser = null;
    let allRecords = [];
    let attendanceChartInstance = null;

    // Set Default Date to Today
    activityDateInput.value = new Date().toISOString().split('T')[0];

    // Initialize Lucide Icons
    function renderIcons() {
      if (window.lucide) {
        lucide.createIcons();
      }
    }

    // Helper: Show Alert Banner
    function showAlert(message, type = 'success') {
      alertMsg.textContent = message;
      alertBox.classList.remove('hidden', 'bg-emerald-50', 'border-emerald-200', 'text-emerald-800', 'bg-rose-50', 'border-rose-200', 'text-rose-800');
      
      if (type === 'success') {
        alertBox.classList.add('bg-emerald-50', 'border-emerald-200', 'text-emerald-800');
      } else {
        alertBox.classList.add('bg-rose-50', 'border-rose-200', 'text-rose-800');
      }
      
      setTimeout(() => {
        alertBox.classList.add('hidden');
      }, 5000);
    }

    alertClose.addEventListener('click', () => {
      alertBox.classList.add('hidden');
    });

    // Authentication Logic
    loginBtn.addEventListener('click', async () => {
      try {
        // Try standard persistence first, fallback to in-memory if blocked by Tracking Prevention
        try {
          await setPersistence(auth, browserLocalPersistence);
        } catch (e) {
          try {
            await setPersistence(auth, indexedDBLocalPersistence);
          } catch (e2) {
            await setPersistence(auth, inMemoryPersistence);
          }
        }
        await signInWithPopup(auth, provider);
      } catch (error) {
        console.error("Login Error:", error);
        if (error.code === 'auth/popup-blocked') {
          showAlert("ポップアップがブロックされました。ブラウザの設定で許可してください。", "error");
        } else if (error.code === 'auth/unauthorized-domain') {
          showAlert("このドメインからのログインがFirebaseで承認されていません。", "error");
        } else {
          showAlert("ログインエラー: " + error.message, "error");
        }
      }
    });

    logoutBtn.addEventListener('click', async () => {
      try {
        await signOut(auth);
        showAlert("ログアウトしました");
      } catch (error) {
        console.error("Logout Error:", error);
      }
    });

    // Auth Observer
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        userName.textContent = user.displayName || 'ユーザー';
        userEmail.textContent = user.email || '';
        if (user.photoURL) {
          userPhoto.src = user.photoURL;
        }

        loginSection.classList.add('hidden');
        appSection.classList.remove('hidden');
        userProfile.classList.remove('hidden');

        // Start real-time Firestore sync
        listenToRecords();
      } else {
        currentUser = null;
        loginSection.classList.remove('hidden');
        appSection.classList.add('hidden');
        userProfile.classList.add('hidden');
      }
      renderIcons();
    });

    // Firestore Real-time Sync
    function listenToRecords() {
      const colRef = collection(db, "activity_records");

      onSnapshot(colRef, (snapshot) => {
        allRecords = [];
        snapshot.forEach((docSnap) => {
          allRecords.push({
            id: docSnap.id,
            ...docSnap.data()
          });
        });

        renderRecords();
      }, (error) => {
        console.error("Firestore Listen Error:", error);
        showAlert("データの取得に失敗しました: " + error.message, "error");
      });
    }

    // Form Submit Handler
    recordForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const clubName = clubNameInput.value;
      const activityDate = activityDateInput.value;
      const memberCount = parseInt(memberCountInput.value, 10);
      const activityContent = activityContentInput.value.trim();
      const activityReflection = activityReflectionInput.value.trim();
      const editDocId = editDocIdInput.value;

      // Validation
      if (!clubName || !activityDate || isNaN(memberCount) || !activityContent || !activityReflection) {
        showAlert("すべての必須項目（*）を入力してください。", "error");
        return;
      }

      if (memberCount < 1) {
        showAlert("参加人数は1人以上を入力してください。", "error");
        return;
      }

      const payload = {
        clubName: clubName,
        activityDate: activityDate,
        memberCount: memberCount,
        activityContent: activityContent,
        activityReflection: activityReflection,
        userName: currentUser ? currentUser.displayName : '不明',
        userEmail: currentUser ? currentUser.email : '',
        updatedAt: serverTimestamp()
      };

      try {
        if (editDocId) {
          // Update existing document
          await updateDoc(doc(db, "activity_records", editDocId), payload);
          showAlert("記録を更新しました！");
          resetForm();
        } else {
          // Add new document
          payload.createdAt = serverTimestamp();
          await addDoc(collection(db, "activity_records"), payload);
          showAlert("新しい記録を登録しました！");
          resetForm();
        }
      } catch (error) {
        console.error("Save Error:", error);
        showAlert("保存エラー: " + error.message, "error");
      }
    });

    // Reset Form
    function resetForm() {
      recordForm.reset();
      editDocIdInput.value = "";
      activityDateInput.value = new Date().toISOString().split('T')[0];
      formTitle.innerHTML = `<i data-lucide="plus-circle" class="w-5 h-5 text-indigo-600"></i> 新しい活動を記録`;
      submitBtnText.textContent = "記録を登録する";
      cancelEditBtn.classList.add('hidden');
      renderIcons();
    }

    cancelEditBtn.addEventListener('click', resetForm);

    // Render Records List & Chart
    function renderRecords() {
      const selectedClub = filterClub.value;
      const selectedSort = sortOrder.value;

      // Filter
      let filtered = allRecords.filter(item => {
        if (selectedClub === 'ALL') return true;
        return item.clubName === selectedClub;
      });

      // Sort by Date
      filtered.sort((a, b) => {
        const dateA = new Date(a.activityDate);
        const dateB = new Date(b.activityDate);
        return selectedSort === 'desc' ? dateB - dateA : dateA - dateB;
      });

      // Render List
      if (filtered.length === 0) {
        recordsList.innerHTML = `
          <div class="text-center py-12 text-slate-400 bg-slate-50/50 rounded-xl border border-dashed border-slate-200">
            <i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2 text-slate-300"></i>
            <p class="text-sm font-medium">該当する活動記録がありません</p>
          </div>
        `;
      } else {
        recordsList.innerHTML = filtered.map(record => `
          <div class="bg-white border border-slate-200 rounded-xl p-5 hover:shadow-md transition group relative">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
              <div class="flex items-center gap-2">
                <span class="inline-block px-2.5 py-1 text-xs font-semibold rounded-md bg-indigo-50 text-indigo-700 border border-indigo-100">
                  ${escapeHtml(record.clubName)}
                </span>
                <span class="text-xs text-slate-500 flex items-center gap-1">
                  <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                  ${escapeHtml(record.activityDate)}
                </span>
              </div>
              <div class="flex items-center gap-2 text-xs text-slate-500">
                <span class="bg-slate-100 px-2 py-0.5 rounded text-slate-600 font-medium">
                  👥 参加: ${record.memberCount}名
                </span>
                <span class="hidden sm:inline text-slate-400">
                  記録: ${escapeHtml(record.userName || '匿名')}
                </span>
              </div>
            </div>

            <div class="space-y-2 mb-4 text-sm">
              <div>
                <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-0.5">活動内容</p>
                <p class="text-slate-800 whitespace-pre-line leading-relaxed">${escapeHtml(record.activityContent)}</p>
              </div>
              <div class="pt-2 border-t border-slate-100">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-0.5">反省・気づき</p>
                <p class="text-slate-600 whitespace-pre-line leading-relaxed italic bg-slate-50 p-2.5 rounded-lg border border-slate-100">${escapeHtml(record.activityReflection)}</p>
              </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-100">
              <button onclick="window.editRecord('${record.id}')" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium px-2.5 py-1.5 rounded-lg hover:bg-indigo-50 transition flex items-center gap-1">
                <i data-lucide="edit-2" class="w-3.5 h-3.5"></i>
                編集
              </button>
              <button onclick="window.deleteRecord('${record.id}')" class="text-xs text-rose-600 hover:text-rose-800 font-medium px-2.5 py-1.5 rounded-lg hover:bg-rose-50 transition flex items-center gap-1">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                削除
              </button>
            </div>
          </div>
        `).join('');
      }

      renderIcons();
      updateChart(filtered);
    }

    // Global Window Methods for Edit & Delete
    window.editRecord = function(docId) {
      const record = allRecords.find(r => r.id === docId);
      if (!record) return;

      editDocIdInput.value = record.id;
      clubNameInput.value = record.clubName;
      activityDateInput.value = record.activityDate;
      memberCountInput.value = record.memberCount;
      activityContentInput.value = record.activityContent;
      activityReflectionInput.value = record.activityReflection;

      formTitle.innerHTML = `<i data-lucide="edit" class="w-5 h-5 text-indigo-600"></i> 記録を編集`;
      submitBtnText.textContent = "変更を保存する";
      cancelEditBtn.classList.remove('hidden');
      renderIcons();

      // Scroll to form on mobile
      recordForm.scrollIntoView({ behavior: 'smooth' });
    };

    window.deleteRecord = async function(docId) {
      if (confirm("この記録を削除してもよろしいですか？")) {
        try {
          await deleteDoc(doc(db, "activity_records", docId));
          showAlert("記録を削除しました。");
        } catch (error) {
          console.error("Delete Error:", error);
          showAlert("削除エラー: " + error.message, "error");
        }
      }
    };

    // Filter & Sort Event Listeners
    filterClub.addEventListener('change', renderRecords);
    sortOrder.addEventListener('change', renderRecords);

    // Update Attendance Chart
    function updateChart(records) {
      const ctx = document.getElementById('attendanceChart').getContext('2d');

      // Sort chronological for chart
      const chartRecords = [...records].sort((a, b) => new Date(a.activityDate) - new Date(b.activityDate));

      const labels = chartRecords.map(r => r.activityDate);
      const dataValues = chartRecords.map(r => r.memberCount);

      if (attendanceChartInstance) {
        attendanceChartInstance.destroy();
      }

      attendanceChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: '参加人数 (人)',
            data: dataValues,
            borderColor: '#4f46e5',
            backgroundColor: 'rgba(79, 70, 229, 0.1)',
            borderWidth: 2,
            fill: true,
            tension: 0.3,
            pointBackgroundColor: '#4f46e5',
            pointRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                stepSize: 1,
                precision: 0
              }
            },
            x: {
              grid: {
                display: false
              }
            }
          }
        }
      });
    }

    // Helper: HTML Escaping
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Initialize UI on load
    window.addEventListener('load', () => {
      renderIcons();
    });
  </script>
</body>
</html>
